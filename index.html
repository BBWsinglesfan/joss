  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { color-scheme: dark; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #f9fafb;
      background:
        radial-gradient(ellipse at center, rgba(40,40,40,.22) 0%, rgba(0,0,0,0) 48%),
        #030303;
    }
    .watch-card {
      width: min(100%, 336px);
      padding: 23px 19px 24px;
      border: 1px solid #303030;
      border-radius: 19px;
      background: rgba(12,12,12,.97);
      text-align: center;
      box-shadow: 0 20px 65px rgba(0,0,0,.55);
    }
    .play-icon {
      width: 45px;
      height: 45px;
      margin: 0 auto 13px;
      display: grid;
      place-items: center;
      border: 1px solid #4a4a4a;
      border-radius: 14px;
      color: #fff;
      font-size: 20px;
      line-height: 1;
    }
    h1 {
      margin-bottom: 9px;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 750;
      letter-spacing: -.35px;
    }
    .subtitle {
      margin-bottom: 22px;
      color: #b8b8b8;
      font-size: 12px;
      line-height: 1.5;
    }
    .button {
      min-height: 42px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 750;
      transition: transform .18s ease, background .18s ease;
    }
    .button:hover { transform: translateY(-1px); }
    .button-primary {
      color: #111;
      background: #fff;
      border: 1px solid #fff;
      margin-bottom: 9px;
    }
    .button-primary:hover { background: #e9e9e9; }
    .button-secondary {
      color: #f5f5f5;
      background: transparent;
      border: 1px solid #777;
    }
    .button-secondary:hover { background: #1b1b1b; }
    .footnote {
      margin-top: 14px;
      color: #777;
      font-size: 10px;
      line-height: 1.45;
    }
    @media (max-width: 360px) {
      body { padding: 16px; }
      .watch-card { padding-inline: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>

  <main class="watch-card">
    <div class="play-icon" aria-hidden="true">▶</div>
    <h1>Ready to watch?</h1>
    <p class="subtitle">Tap Continue to load the video player.</p>

    <a
